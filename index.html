<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="加密貨幣星球小鎮：每個分類一顆星球、每個幣種一間店，門口隊伍是 24 小時主動買賣量。">
<title>加密星球小鎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>

<header id="brand" class="panel">
  <h1>加密星球小鎮</h1>
  <p id="view-title">太陽系・點選星球進入</p>
  <p id="status" class="label">載入行情中…</p>
</header>

<button id="back" class="panel chip" type="button" hidden>← 返回太陽系</button>

<aside id="coin-card" class="panel" hidden aria-live="polite">
  <button id="coin-close" class="close" type="button" aria-label="關閉">×</button>
  <div class="coin-head">
    <span id="coin-rank" class="label"></span>
    <h2 id="coin-symbol"></h2>
    <span id="coin-name" class="muted"></span>
  </div>
  <div class="coin-price">
    <span id="coin-price"></span>
    <span id="coin-change"></span>
  </div>
  <dl class="coin-stats">
    <div><dt>市值</dt><dd id="coin-mcap"></dd></div>
    <div><dt>24h 成交額</dt><dd id="coin-volume"></dd></div>
    <div><dt>主動買入</dt><dd id="coin-buy" class="up"></dd></div>
    <div><dt>主動賣出</dt><dd id="coin-sell" class="down"></dd></div>
    <div><dt>買方佔比</dt><dd id="coin-share"></dd></div>
    <div><dt>24h 成交筆數</dt><dd id="coin-trades"></dd></div>
  </dl>
  <p class="label" id="coin-pair"></p>
</aside>

<nav id="coin-strip" class="panel" aria-label="幣種" hidden></nav>

<footer id="controls" class="panel">
  <div class="speed" role="group" aria-label="播放速度">
    <button type="button" data-speed="0">❚❚</button>
    <button type="button" data-speed="1" class="active">1×</button>
    <button type="button" data-speed="3">3×</button>
    <button type="button" data-speed="10">10×</button>
  </div>
  <p class="legend">
    <span><i class="dot up"></i>右側隊伍＝主動買入</span>
    <span><i class="dot down"></i>左側＝主動賣出</span>
    <span><i class="dot walker"></i>路人＝成交量</span>
  </p>
</footer>

<div id="toast" class="panel" role="status" hidden></div>
<div id="loading"><div class="spinner"></div>載入行情中…</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
