<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Crypto markets as a tiny solar system: one planet per sector, one shop per coin.">
<title>Crypto Planet Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>

<header id="brand" class="panel">
  <h1 data-i18n="app.title"></h1>
  <p id="view-title"></p>
  <p id="status" class="label"></p>
</header>

<div id="top-actions">
  <button id="back" class="panel chip" type="button" hidden></button>
  <button id="theme" class="panel chip" type="button"></button>
  <button id="lang" class="panel chip" type="button"></button>
</div>

<aside id="coin-card" class="panel" hidden aria-live="polite">
  <button id="coin-close" class="close" type="button" data-i18n-aria="card.close">×</button>
  <div class="coin-head">
    <span id="coin-rank" class="label"></span>
    <h2 id="coin-symbol"></h2>
    <span id="coin-name" class="muted"></span>
    <span id="coin-tier" class="tier-badge"></span>
  </div>
  <div class="coin-price">
    <span id="coin-price"></span>
    <span id="coin-change"></span>
  </div>
  <dl class="coin-stats">
    <div><dt data-i18n="card.mcap"></dt><dd id="coin-mcap"></dd></div>
    <div><dt data-i18n="card.volume"></dt><dd id="coin-volume"></dd></div>
    <div><dt data-i18n="card.buy"></dt><dd id="coin-buy" class="up"></dd></div>
    <div><dt data-i18n="card.sell"></dt><dd id="coin-sell" class="down"></dd></div>
    <div><dt data-i18n="card.share"></dt><dd id="coin-share"></dd></div>
    <div><dt data-i18n="card.trades"></dt><dd id="coin-trades"></dd></div>
  </dl>
  <p class="label" id="coin-pair"></p>
</aside>

<aside id="etf-card" class="panel" hidden aria-live="polite">
  <button id="etf-close" class="close" type="button" data-i18n-aria="card.close">×</button>
  <div class="coin-head">
    <span id="etf-rank" class="label"></span>
    <h2 id="etf-asset"></h2>
    <span id="etf-count" class="asset-badge"></span>
    <span id="etf-tier" class="tier-badge"></span>
  </div>
  <p id="etf-tickers" class="muted etf-name"></p>
  <div class="coin-price">
    <span class="label" data-i18n="etf.inflow"></span>
    <span id="etf-inflow"></span>
  </div>
  <dl class="coin-stats">
    <div><dt data-i18n="etf.aum"></dt><dd id="etf-aum"></dd></div>
    <div><dt data-i18n="etf.traded"></dt><dd id="etf-traded"></dd></div>
    <div><dt data-i18n="etf.cum"></dt><dd id="etf-cum"></dd></div>
  </dl>
  <p class="label" id="etf-source"></p>
</aside>

<aside id="park-card" class="panel" hidden aria-live="polite">
  <button id="park-close" class="close" type="button" data-i18n-aria="card.close">×</button>
  <div class="coin-head"><h2 data-i18n="park.name"></h2></div>
  <p class="scope-note" data-i18n="park.scope"></p>
  <div class="coin-price"><span id="park-total"></span></div>
  <dl class="coin-stats">
    <div><dt data-i18n="park.longLabel"></dt><dd id="park-long" class="down"></dd></div>
    <div><dt data-i18n="park.shortLabel"></dt><dd id="park-short" class="up"></dd></div>
    <div><dt data-i18n="park.longShare"></dt><dd id="park-share"></dd></div>
  </dl>
  <p class="label" data-i18n="park.top"></p>
  <ol id="park-top" class="park-top"></ol>
  <p class="label" data-i18n="park.legend"></p>
  <p class="label" id="park-source"></p>
</aside>

<nav id="coin-strip" class="panel" data-i18n-aria="strip.label" hidden></nav>

<footer id="controls" class="panel">
  <div class="speed" role="group" data-i18n-aria="speed.label">
    <button type="button" data-speed="0">❚❚</button>
    <button type="button" data-speed="1" class="active">1×</button>
    <button type="button" data-speed="3">3×</button>
    <button type="button" data-speed="10">10×</button>
  </div>
  <p class="legend">
    <span><i class="dot up"></i><span id="legend-buy" data-i18n="legend.buy"></span></span>
    <span><i class="dot down"></i><span id="legend-sell" data-i18n="legend.sell"></span></span>
    <span><i class="dot walker"></i><span id="legend-walkers" data-i18n="legend.walkers"></span></span>
  </p>
</footer>

<div id="toast" class="panel" role="status" hidden></div>
<div id="loading"><div class="spinner"></div><span data-i18n="status.loading"></span></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
