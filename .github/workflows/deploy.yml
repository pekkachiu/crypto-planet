name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # ETF 資金流是 T+1 結算，每天抓兩次（台灣時間 09:30、21:30），重新部署
  schedule:
    - cron: '30 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # Key 只交給這一步：npm 套件的安裝腳本與其他步驟都拿不到，fetch-etf.mjs 也不載入任何 npm 套件
      - name: Fetch ETF data from SoSoValue
        id: etf
        continue-on-error: true
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        run: node scripts/fetch-etf.mjs public/data/etf.json
      # 抓取失敗時沿用網站上目前的 etf.json（網頁會顯示資料日期），抓不到就讓 ETF 星暫停開放
      - name: Keep previous ETF data
        if: steps.etf.outcome != 'success'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p public/data
          curl -fsS --max-time 20 "$BASE_URL/data/etf.json" -o public/data/etf.json || echo "::warning::沒有可沿用的 ETF 資料"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只有部署這一步需要寫入 Pages 的權限
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
